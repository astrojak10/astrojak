name = "astrojak"
main = "cloudflare/worker.mjs"
compatibility_date = "2025-03-01"
workers_dev = false

routes = [
  { pattern = "api.astrojak.in", custom_domain = true }
]

[[kv_namespaces]]
binding = "PAYMENT_SETTINGS"
# Replace this with the ID of the PAYMENT_SETTINGS namespace created in Cloudflare.
id = "REPLACE_WITH_KV_NAMESPACE_ID"
