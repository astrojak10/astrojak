<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <title>Payment return | ASTROJAK</title>
</head>
<body>
  <p id="message">Returning to ASTROJAK checkout…</p>
  <script>
    (function(){
      var reference=new URLSearchParams(location.search).get('reference')||'';
      if(window.parent!==window&&/^[A-Za-z0-9_-]{1,50}$/.test(reference)){
        window.parent.postMessage({
          type:'pinelabs-checkout-return',
          reference:reference
        },location.origin);
        return;
      }
      document.getElementById('message').textContent='Return to the ASTROJAK page to check your payment status.';
    })();
  </script>
</body>
</html>
